spring.application.name=4-th-year-project
spring.config.import=optional:file:.env[.properties]
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
server.port=${SERVER_PORT:8081}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads

spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:60000}

app.auth.admin.username=${ADMIN_USERNAME:}
app.auth.admin.password=${ADMIN_PASSWORD:}
app.auth.faculty.username=${FACULTY_USERNAME:}
app.auth.faculty.password=${FACULTY_PASSWORD:}
app.auth.student.username=${STUDENT_USERNAME:}
app.auth.student.password=${STUDENT_PASSWORD:}
app.auth.security.username=${SECURITY_USERNAME:}
app.auth.security.password=${SECURITY_PASSWORD:}
app.auth.librarian.username=${LIBRARIAN_USERNAME:}
app.auth.librarian.password=${LIBRARIAN_PASSWORD:}
app.auth.placement.username=${PLACEMENT_USERNAME:}
app.auth.placement.password=${PLACEMENT_PASSWORD:}
